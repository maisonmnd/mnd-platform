<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- HORS DES MOTEURS, 24 septembre 2026 : un ecran a connexion ou un
         document personnel n a rien a faire dans Google. Le robots.txt de
         /trone/ ne comptait pas, seul celui de la racine est lu. -->
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#B97A4A" />
    <!-- LE THÈME AVANT LE PREMIER AFFICHAGE (3 octobre 2026) : le choix de la
         cliente (Profil, voir src/apps/couronne/theme.ts) est posé avant que
         la page ne se peigne, sinon « Sombre » clignoterait en blanc. -->
    <script>try{var t=localStorage.getItem('mc_theme');if(t==='clair'||t==='sombre'){document.documentElement.setAttribute('data-mc-theme',t);}var s=t==='sombre'||(t!=='clair'&&matchMedia('(prefers-color-scheme: dark)').matches);document.querySelector('meta[name="theme-color"]').setAttribute('content',s?'#15173A':'#B97A4A');}catch(e){}</script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ma Couronne" />
    <link rel="apple-touch-icon" href="/assets/icons/couronne-192.png" />
    <link rel="manifest" href="/manifest.couronne.webmanifest" />
    <link rel="icon" type="image/png" href="/assets/monograms/mono-copper.png" />
    <title>Ma Couronne — Maison MND</title>
    <!-- ══ LA CARTE DE LIEN — 7 septembre 2026 ═════════════════════════
         « Quand j'envoie le lien de MND, ça doit se présenter comme celui de
         Claude » (Yéman) : la carte compacte, vignette à gauche, titre et
         phrase, pas la grande affiche blanche. WhatsApp ne fait la compacte
         que si l'image est PETITE (sous ~300 px) — la vignette fait 240 px,
         et c'est un choix, pas une économie.

         AUCUN DOMAINE EN DUR : og:image et og:url exigent une adresse
         absolue, et la règle de la Maison interdit d'en écrire une. Les
         repères __LIEN_DU_SITE__ / __LIEN_DE_LA_PAGE__ sont remplacés par
         build-sites.mjs, qui lit le compte GitHub depuis l'origine du dépôt,
         comme le fait déjà la publication. En développement ils restent tels
         quels : personne ne partage localhost. -->
    <meta name="description" content="Votre espace chez la Maison : vos rendez-vous, votre suivi et vos bilans de couronne." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Maison MND" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Ma Couronne · Maison MND" />
    <meta property="og:description" content="Votre espace chez la Maison : vos rendez-vous, votre suivi et vos bilans de couronne." />
    <meta property="og:url" content="__LIEN_DE_LA_PAGE__" />
    <meta property="og:image" content="__LIEN_DU_SITE__assets/og/carte-lien.png" />
    <meta property="og:image:width" content="240" />
    <meta property="og:image:height" content="240" />
    <meta name="twitter:card" content="summary" />

  </head>
  <body data-surface="couronne">
    <div id="root"></div>
    <script type="module" src="/src/apps/couronne/main.tsx"></script>
  </body>
</html>
