<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Régler par MoMo · Maison MND</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#F6F1E7" />
<!--
  RÉGLER PAR MoMo — la page qu'on envoie à une cliente. 18 août 2026.

  Demande de Yéman : « create a share link to QR codes », et, mise devant le
  choix, « la MoMoPay seule ». Le mot de passe des deux réseaux Wi-Fi vit sur
  l'écran QR Codes du Trône ; un lien se transfère, se capture d'écran, reste
  dans une conversation. Cette page-ci n'en porte rien.

  ELLE EST STATIQUE, ET C'EST LA GARANTIE. Aucune base lue, aucune clé, aucune
  session : elle ne sait que ce que son adresse lui dit. Il n'existe donc rien
  à en extraire — ni une cliente, ni un chiffre, ni un mot de passe.

    payer.html?m=MAISON%20MND&c=909099            le marchand et son code
    payer.html?m=MAISON%20MND&c=909099&montant=30000   … et la somme attendue

  LE COMPTE DE LA MAISON — 19 octobre 2026. MAISON MND a son propre compte
  MoMoPay, code 909099 ; l'ancien, 506846, était celui d'ACIA 1. Un lien
  envoyé avant porte encore c=506846 : il mène désormais au compte de la
  Maison (la règle est `codeDuLien`, shared/momopay-de-la-maison-pur.ts).
  La page prend les couleurs de la charte, épurée comme les nouvelles
  affiches : ivoire, indigo, cuivre ; plus d'image noir et or.

  Le montant, quand il est là, entre directement dans le code à composer : la
  cliente appuie, son téléphone compose, elle n'a plus qu'à valider. C'est le
  geste le plus court entre une facture et l'argent reçu.

  PAS DE QR ICI, ET C'EST VOULU : on ne scanne pas l'écran qu'on tient en main.
  Un lien reçu par téléphone se règle en composant, pas en photographiant.

  TAP & GO — 17 octobre 2026 (« quand le code USSD s'affiche, l'envoyer sur
  le téléphone de la cliente instantanément »). Le Trône envoie ce lien sur
  son WhatsApp dès que le numéro s'affiche au comptoir :

    payer.html?tg=51166-25400        le code de la Maison chez FedaPay, et le total

  Le numéro composé est *601*14*<code>*<total>#, n'importe quel réseau, même
  sans internet. Sur Android, le bouton le compose ; un iPhone refuse qu'une
  page compose un numéro à étoiles : le bouton « Copier » le donne. Ni
  l'affiche MoMoPay ni le marchand MTN ici : ce n'est pas MTN qui encaisse,
  c'est FedaPay, pour la Maison.
-->
<style>
  /* La charte : ivoire pour le fond, indigo pour l'encre, cuivre pour le geste. */
  :root {
    --ivoire: #F6F1E7;
    --carte: #FFFDF9;
    --indigo: #1E2150;
    --cuivre: #9A6036;
    --cuivre-clair: #B97A4A;
    --filet: #E7D7C2;
    --doux: #5E5750;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ivoire);
    color: var(--indigo);
    font-family: 'Jost', 'Century Gothic', 'Futura', system-ui, -apple-system, 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 18px 40px;
    min-height: 100vh;
  }
  /* La tête : le verrou de la Maison, et ce qu'on règle. Pas de QR ici : on
     ne scanne pas l'écran qu'on tient en main. */
  .tete { width: min(100%, 420px); display: grid; justify-items: center; gap: 10px; text-align: center; }
  .verrou { width: 170px; height: auto; display: block; }
  .sur { margin: 10px 0 0; font-size: 11px; letter-spacing: .32em; text-transform: uppercase; color: var(--cuivre); }
  .tete h1 { margin: 0; font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-weight: 300; font-size: 38px; line-height: 1.05; }
  .bloc { width: min(100%, 420px); }
  .titre {
    font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    font-weight: 300;
    font-size: 26px;
    letter-spacing: .01em;
    margin: 26px 0 4px;
    text-align: center;
  }
  .sous { font-size: 13.5px; color: var(--doux); text-align: center; line-height: 1.6; margin: 0 0 18px; }
  .composer {
    display: block;
    width: 100%;
    text-align: center;
    text-decoration: none;
    background: var(--cuivre);
    color: var(--ivoire);
    font-weight: 600;
    font-size: 17px;
    letter-spacing: .02em;
    padding: 17px 18px;
    border-radius: 4px;
    margin-bottom: 10px;
  }
  .composer small { display: block; font-weight: 400; font-size: 12px; opacity: .72; margin-top: 3px; letter-spacing: .04em; }
  .copier {
    display: block;
    width: 100%;
    background: transparent;
    color: var(--indigo);
    border: 1px solid var(--filet);
    border-radius: 4px;
    padding: 13px 18px;
    font: inherit;
    font-size: 13.5px;
    cursor: pointer;
  }
  .ligne {
    display: flex; justify-content: space-between; gap: 14px;
    padding: 11px 0; border-bottom: 1px solid var(--filet);
    font-size: 14px;
  }
  .ligne span:first-child { color: var(--doux); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
  .ligne b { font-weight: 600; letter-spacing: .04em; }
  .pied {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic; font-size: 13.5px; color: var(--cuivre);
    margin-top: 26px; text-align: center;
  }
  .absent { text-align: center; color: var(--doux); font-size: 14px; line-height: 1.7; padding: 40px 10px; }
  /* Tap & Go : les couleurs de la Maison, indigo et cuivre (jamais d'obsidienne). */
  body.tapgo { background: #1E2150; color: #F6F1E7; justify-content: center; }
  body.tapgo .sous, body.tapgo .ligne span:first-child { color: #B8B8C4; }
  body.tapgo .copier { color: #F6F1E7; border-color: rgba(246, 241, 231, .32); }
  body.tapgo .ligne { border-bottom-color: rgba(246, 241, 231, .12); }
  body.tapgo .composer { background: #B97A4A; color: #F6F1E7; }
  body.tapgo .pied { color: #D9B08C; }
  .maison { font-size: 11px; letter-spacing: .32em; text-transform: uppercase; color: #D9B08C; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
  <div class="tete" id="tete">
    <img class="verrou" src="assets/vectoriel/verrou-couche-indigo.svg" alt="Maison MND" />
    <p class="sur">Régler votre rituel</p>
    <h1>Par MTN MoMo</h1>
  </div>

  <div class="bloc" id="bloc"></div>

  <div class="pied">mi nyɔ́ ɖɛkpɛ, votre beauté est déjà là</div>

<script>
  var p = new URLSearchParams(location.search);
  var e = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); };
  /* TAP & GO : « tg=CODE-TOTAL », chiffres seulement, sinon rien ne se compose. */
  var tg = (p.get('tg') || '').match(/^(\d{3,8})-(\d{1,9})$/);
  if (p.has('tg')) {
    document.body.classList.add('tapgo');
    var tete = document.getElementById('tete');
    if (tete && tete.parentNode) tete.parentNode.removeChild(tete);
    document.title = 'Régler · Maison MND';
    var blocTg = document.getElementById('bloc');
    if (!tg) {
      blocTg.innerHTML = '<div class="absent">Ce lien est incomplet.<br>Demandez-en un nouveau à la Maison.</div>';
    } else {
      var ussdTg = '*601*14*' + tg[1] + '*' + tg[2] + '#';
      blocTg.innerHTML =
        '<div class="maison">Maison MND</div>' +
        '<div class="titre">À régler · ' + Number(tg[2]).toLocaleString('fr-FR') + ' F</div>' +
        '<div class="sous">Appuyez : votre téléphone compose le numéro, montant compris. MTN, Moov ou Celtiis, même sans internet. Confirmez ensuite le paiement sur votre téléphone.</div>' +
        '<a class="composer" href="tel:' + encodeURIComponent(ussdTg) + '">Composer' +
          '<small>' + e(ussdTg) + '</small></a>' +
        '<button class="copier" id="copierTg">Copier le numéro</button>' +
        '<div class="sous" style="margin-top:14px">Sur iPhone, copiez-le puis collez-le dans le clavier d’appel.</div>' +
        '<div class="ligne"><span>Encaissé par</span><b>FedaPay, pour la Maison MND</b></div>';
      document.getElementById('copierTg').onclick = function () {
        var b = this;
        navigator.clipboard.writeText(ussdTg).then(function () {
          b.textContent = 'Numéro copié';
          setTimeout(function () { b.textContent = 'Copier le numéro'; }, 1800);
        }).catch(function () { b.textContent = ussdTg; });
      };
    }
  }
  var marchand = (p.get('m') || '').trim();
  var code = (p.get('c') || '').replace(/[^0-9]/g, '');
  /* UN LIEN D'AVANT LE 19 OCTOBRE 2026 (l'ancien compte d'ACIA 1, 506846)
     mène au compte de la Maison : même règle que `codeDuLien`. */
  if (code === '506846') { code = '909099'; marchand = 'MAISON MND'; }
  var montant = (p.get('montant') || '').replace(/[^0-9]/g, '');
  var bloc = document.getElementById('bloc');

  if (p.has('tg')) {
    /* Tap & Go : déjà dit plus haut. */
  } else if (!code) {
    /* Sans code marchand, la page ne devine rien : elle le DIT plutôt que
       d'afficher un bouton qui composerait un numéro incomplet. */
    bloc.innerHTML = '<div class="absent">Ce lien est incomplet, il lui manque le code marchand.<br>Demandez-en un nouveau à la Maison.</div>';
  } else {
    var ussd = '*880*41*' + code + '*' + (montant || '') + '#';
    bloc.innerHTML =
      '<div class="titre">' + (montant ? 'À régler · ' + Number(montant).toLocaleString('fr-FR') + ' F' : 'Régler par MoMo') + '</div>' +
      '<div class="sous">' + (montant
        ? 'Appuyez : votre téléphone compose le code, le montant est déjà inscrit. Vérifiez le nom du marchand avant de valider.'
        : 'Appuyez, puis saisissez le montant avant le dièse. Vérifiez le nom du marchand avant de valider.') + '</div>' +
      '<a class="composer" href="tel:' + encodeURIComponent(ussd) + '">Composer le code' +
        '<small>' + e(ussd) + '</small></a>' +
      '<button class="copier" id="copier">Copier le code</button>' +
      '<div class="ligne"><span>Marchand</span><b>' + e(marchand || 'MAISON MND') + '</b></div>' +
      '<div class="ligne"><span>Code marchand</span><b>' + e(code) + '</b></div>';

    document.getElementById('copier').onclick = function () {
      var b = this;
      navigator.clipboard.writeText(ussd).then(function () {
        b.textContent = 'Code copié';
        setTimeout(function () { b.textContent = 'Copier le code'; }, 1800);
      }).catch(function () { b.textContent = ussd; });
    };
  }
</script>
</body>
</html>
